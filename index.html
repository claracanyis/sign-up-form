<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hero">
    <img src="img/Leafs.jpg" alt="Dense leaf background">
    <div class="logo">
      <img src="img/ant-logo-white.png" alt="Ant profile">
      <h1>Formie</h1>
    </div>
  </div>

  <div class="container">
    <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. 
      Sign up <em>now</em> to get started.</p>
    <p>You know you want to.</p>
    <form action="" method="post">
      <div class="box">
        <h2>Let's do this!</h2>
        <div class="inputs">
          <fieldset>
            <label for="first_name">First name</label>
            <input type="text" name="first_name" id="first_name">
          </fieldset>
          <fieldset>
            <label for="last_name">Last name</label>
            <input type="text" name="last_name" id="last_name">
          </fieldset>
          <fieldset>
            <label for="email">Email</label>
            <input type="email" name="email" id="email">
          </fieldset>
          <fieldset>
            <label for="phone">Phone number</label>
            <input type="number" name="phone" id="phone">
          </fieldset>
          <fieldset>
            <label for="password">Password</label>
            <input type="password" name="password" id="password">
          </fieldset>
          <fieldset>
            <label for="password_confirm">Confirm password</label>
            <input type="password" name="password_confirm" id="password_confirm">
          </fieldset>
        </div>
      </div>
      <button type="submit">Create Account</button>
    </form>
    <p class="login">Already have an account? <a href="#">Log in</a></p>
  </div>
</body>
</html>
